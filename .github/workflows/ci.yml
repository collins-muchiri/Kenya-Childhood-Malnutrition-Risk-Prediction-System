name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-gates:
    name: python-gates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (pinned SHA)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned SHA)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (declared manifest)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black --check)
        run: black --check .

      - name: Suppression audit (no undeclared/expired skips, noqa, ignores)
        run: python scripts/audit_suppressions.py --check

      - name: Security (pip-audit)
        run: pip-audit --progress-spinner off

      - name: Tests + coverage floor (35%, measured 38% on 2026-10-25)
        run: pytest tests/ -q --cov=src --cov=app --cov=config --cov-report=term --cov-fail-under=35

      - name: Tracked-file drift guard (tests must not dirty the worktree)
        run: |
          git diff --exit-code
          echo "drift guard: worktree clean after test run"

  web-gates:
    name: web-gates (deployed frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (pinned SHA)

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0 (pinned SHA)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install from lockfile
        run: npm ci

      - name: Supply-chain audit (fail on high+; tailwind moderates tracked in issue #6)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (eslint flat config; errors fail, warnings reported)
        run: npm run lint

      - name: Production build (the artefact Vercel deploys)
        run: npm run build
